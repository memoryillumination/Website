<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="css/output.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login — Memory Illumination</title>
    <script src="js/transitions.js" defer></script>
    <script src="js/login.js" defer></script>
  </head>
  <body class="bg-[#f6f6f6] text-[#0f0f0f] antialiased">
    <header class="fixed top-0 left-0 right-0 z-[100] bg-white border-b border-[#e5e5e5] h-14">
      <div class="max-w-[1100px] mx-auto px-6 h-full flex items-center justify-between">
        <a href="index.html" class="font-semibold text-[1.1em] text-[#0f0f0f] no-underline select-none"
          >Memory Illumination</a
        >
        <nav class="flex gap-3 items-center">
          <a
            href="about.html"
            class="text-[0.9em] font-medium text-[#0f0f0f] no-underline px-2 py-1 hover:text-[#007bff]"
            >About</a
          >
          <a href="faq.html" class="text-[0.9em] font-medium text-[#0f0f0f] no-underline px-2 py-1 hover:text-[#007bff]"
            >FAQ</a
          >
          <a
            href="login.html"
            class="inline-block px-[1.1em] py-[0.4em] text-[0.9em] font-medium rounded-lg border border-[#007bff] bg-[#007bff] text-white no-underline cursor-default"
            >Login</a
          >
          <a
            href="register.html"
            class="inline-block px-[1.1em] py-[0.4em] text-[0.9em] font-medium rounded-lg border border-[#007bff] bg-transparent text-[#007bff] no-underline hover:bg-[#007bff] hover:text-white"
            >Register</a
          >
        </nav>
      </div>
    </header>

    <main class="mx-auto px-4 pt-14 pb-8 flex flex-col justify-center text-center max-w-[500px] min-h-screen">
      <form id="login-form" class="flex flex-col gap-5 p-8 rounded-xl shadow-[0_4px_16px_rgba(0,0,0,0.07)] bg-white">
        <h3 class="text-lg font-semibold m-0">Login</h3>
        <div class="flex w-full text-left gap-2">
          <input
            id="login-username-input"
            placeholder="Email"
            required
            class="w-full rounded-lg border border-[#ccc] px-[1.2em] py-[0.6em] text-[1em] bg-white transition-[border-color] duration-[0.25s] focus:outline-none focus:border-[#396cd8] box-border"
          />
        </div>
        <div class="flex w-full text-left gap-2" style="position: relative">
          <input
            id="login-password-input"
            type="password"
            placeholder="Password"
            required
            class="w-full rounded-lg border border-[#ccc] px-[1.2em] py-[0.6em] text-[1em] bg-white transition-[border-color] duration-[0.25s] focus:outline-none focus:border-[#396cd8] box-border"
            style="padding-right: 3em"
          />
          <button
            type="button"
            id="login-show-password"
            aria-label="Show password"
            aria-pressed="false"
            title="Show password"
            style="
              position: absolute;
              right: 0.9em;
              top: 50%;
              transform: translateY(-50%);
              display: flex;
              align-items: center;
              background: none;
              border: 0;
              padding: 0;
              cursor: pointer;
              color: #6c757d;
            "
          >
            <svg
              data-eye="closed"
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path
                d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"
              />
              <line x1="1" y1="1" x2="23" y2="23" />
            </svg>
            <svg
              data-eye="open"
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              style="display: none"
              aria-hidden="true"
            >
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
          </button>
        </div>
        <button
          type="submit"
          class="w-full rounded-lg border border-[#007bff] px-[1.2em] py-[0.6em] text-[1em] font-medium bg-[#007bff] text-white cursor-pointer hover:bg-[#0056b3] hover:border-[#0056b3] active:bg-[#004a99] active:border-[#004a99] box-border"
        >
          Login
        </button>
        <a
          href="register.html"
          class="w-full rounded-lg border border-[#6c757d] px-[1.2em] py-[0.6em] text-[1em] font-medium bg-[#6c757d] text-white no-underline text-center hover:bg-[#5a6268] hover:border-[#545b62] box-border"
          >Need an account? Register</a
        >
      </form>
      <p id="status-message" class="mt-4 font-bold min-h-6"></p>
      <p id="resend-block" class="mt-1 text-[0.9em] text-[#444] hidden">
        Didn't get the confirmation email?
        <button
          id="resend-btn"
          type="button"
          class="bg-transparent border-none p-0 text-[#007bff] cursor-pointer text-[1em] font-medium"
          style="text-decoration: underline"
        >
          Resend it
        </button>
      </p>
    </main>
  </body>
</html>
